name: WorldMark Seaside Daily Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"  # 8:00 AM Pacific during PDT; adjust for PST if desired

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run availability agent
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python agent.py

      - name: Upload report and history
        uses: actions/upload-artifact@v4
        with:
          name: worldmark-seaside-${{ github.run_number }}
          path: data/

      - name: Commit history
        run: |
          git config user.name "WorldMark Seaside Agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/latest.json data/report.txt
          git diff --cached --quiet || git commit -m "Update WorldMark Seaside history"
          git push
